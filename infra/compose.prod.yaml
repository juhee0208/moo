# 스테이징/운영 서버용. 서버의 /opt/moo/ 에 이 파일과 .env 를 둔다.
# 배포는 scripts/deploy.sh <API_IMAGE> 로 한다. (pull → migrate → up)
name: moo

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data # API 교체와 무관하게 데이터 유지
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - db-net
    logging: *default-logging
    restart: unless-stopped

  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000" # 외부 요청은 호스트의 Nginx(HTTPS)가 받아서 전달
    # healthcheck 는 이미지(Dockerfile HEALTHCHECK)에 들어 있다
    init: true # 종료 신호 전달 · 좀비 프로세스 정리
    read_only: true # 컨테이너 파일 시스템 쓰기 금지 (사진 업로드 등은 별도 volume 으로)
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      - app-net
      - db-net
    logging: *default-logging
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  app-net:
  db-net:
    internal: true
