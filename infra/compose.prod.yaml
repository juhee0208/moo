# 스테이징/운영 서버용. 서버의 /opt/moo/ 에 이 파일과 .env 를 둔다.
# 배포: API_IMAGE=<registry>/moo-api:<tag> docker compose -f compose.prod.yaml up -d api
name: moo

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data # API 교체와 무관하게 데이터 유지
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - db-net
    restart: unless-stopped

  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000" # 외부 요청은 호스트의 Nginx(HTTPS)가 받아서 전달
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - app-net
      - db-net
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  app-net:
  db-net:
    internal: true
