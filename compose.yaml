# 로컬 개발용: docker compose up --build -d
# 마이그레이션: docker compose run --rm api node src/db/migrate.js  (운영 이미지에는 npm 이 없다)
name: moo

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-moo_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - db-net
    logging: *default-logging
    restart: unless-stopped

  api:
    build:
      context: ./backend
      target: runtime
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-moo_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_NAME: ${POSTGRES_DB:-moo_db}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # 실제 폰에서 접속하려면 "0.0.0.0:3000:3000" 으로 바꾸고 방화벽 확인
      - "127.0.0.1:${API_PORT:-3000}:3000"
    # healthcheck 는 이미지(Dockerfile HEALTHCHECK)에 들어 있다
    # 운영과 같은 보안 설정으로 실행
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      - app-net
      - db-net
    logging: *default-logging
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  app-net:
  db-net:
    internal: true # DB는 외부에서 직접 접근 불가, api 컨테이너를 통해서만 접근
